# Local development infrastructure only; the application itself runs with mvnw / npm.
#   docker compose up -d     start RabbitMQ and the Mailpit test inbox
#   docker compose down      stop them
services:
  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"     # AMQP, used by the backend
      - "15672:15672"   # management UI: http://localhost:15672 (guest / guest)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"     # SMTP, used by the backend
      - "8025:8025"     # inbox UI: http://localhost:8025

volumes:
  rabbitmq-data:
