spring.application.name=GarageRepairShopManagementSystem

# File-based H2 so data survives restarts; stored in ./data relative to the working directory.
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/garage;MODE=PostgreSQL;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.cache.type=simple
spring.cache.cache-names=customers,vehicles,repairJobs,parts,mechanics,invoices,users

server.port=8080
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174}

spring.jackson.serialization.write-dates-as-timestamps=false

app.security.jwt.secret=${JWT_SECRET:ThisIsAStrongSecretKeyForGarageApp_ChangeItInProduction_2026!}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.security.invitation.accept-url=${INVITATION_ACCEPT_URL:http://localhost:5173/accept-invitation}
# Returns the one-time link in the API response. Development only: the link should reach the invitee by email.
app.security.invitation.expose-link=${INVITATION_EXPOSE_LINK:false}
app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:false}

app.messaging.rabbitmq.enabled=${RABBITMQ_ENABLED:false}
app.messaging.rabbitmq.exchange=${RABBITMQ_EXCHANGE:garage.events}
app.messaging.rabbitmq.routing-key=${RABBITMQ_ROUTING_KEY:garage.notifications}
app.messaging.rabbitmq.queue=${RABBITMQ_QUEUE:garage.notifications}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# Failed deliveries are retried, then rejected without requeue so RabbitMQ moves them to the dead-letter queue.
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=3
spring.rabbitmq.listener.simple.retry.initial-interval=2s
spring.rabbitmq.listener.simple.retry.multiplier=2
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Without MAIL_ENABLED=true, emails are written to the application log instead of being sent.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:Pitlane <no-reply@pitlane.local>}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:}

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO