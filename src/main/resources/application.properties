spring.application.name=GarageRepairShopManagementSystem

spring.datasource.url=${DB_URL:jdbc:h2:mem:garage;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.cache.type=simple
spring.cache.cache-names=customers,vehicles,repairJobs,parts,mechanics,invoices,users

server.port=8080
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174}

spring.jackson.serialization.write-dates-as-timestamps=false

app.security.jwt.secret=${JWT_SECRET:ThisIsAStrongSecretKeyForGarageApp_ChangeItInProduction_2026!}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.security.invitation.accept-url=${INVITATION_ACCEPT_URL:http://localhost:5173/accept-invitation}
app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:false}

app.messaging.rabbitmq.enabled=${RABBITMQ_ENABLED:false}
app.messaging.rabbitmq.exchange=${RABBITMQ_EXCHANGE:garage.events}
app.messaging.rabbitmq.routing-key=${RABBITMQ_ROUTING_KEY:garage.notifications}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${JWT_ISSUER_URI:}

logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.orm.jdbc.bind=INFO